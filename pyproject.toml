[project]
name = "font-search"
version = "0.1.0"
description = "Find system fonts matching text in an image"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10, <=3.13"
dependencies = [
    "fonttools>=4.40",
    "numpy>=1.24",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "pyside6>=6.5",
    "scikit-image>=0.21",
]

[project.scripts]
font-search = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pyinstaller>=6.0",
]
